<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Bookmarks</title>

  <link rel="stylesheet" href="style.css">

  <script type="module" src="script.js"></script>
</head>

<body>
  <main>
    <h1>Shared Bookmarks</h1>

    <section aria-labelledby="user-heading">
      <h2 id="user-heading">Choose a user</h2>

      <label for="user-select">Select a user</label>
      <select id="user-select">
        <option value="">Select a user</option>
      </select>
    </section>

    <section aria-labelledby="bookmarks-heading">
      <h2 id="bookmarks-heading">Bookmarks</h2>

      <ul id="bookmark-list"></ul>
    </section>

    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a bookmark</h2>

      <form id="bookmark-form">

        <div>
          <label for="bookmark-url">URL</label>
          <input
            id="bookmark-url"
            name="url"
            type="url"
            required
          >
        </div>

        <div>
          <label for="bookmark-title">Title</label>
          <input
            id="bookmark-title"
            name="title"
            type="text"
            required
          >
        </div>

        <div>
          <label for="bookmark-description">Description</label>
          <textarea
            id="bookmark-description"
            name="description"
            required
          ></textarea>
        </div>

        <button type="submit">Add bookmark</button>

      </form>
    </section>
  </main>
</body>

</html>
